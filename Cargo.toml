[workspace]
members = [
  "apps/seekdeep",
  "crates/cordis",
  "crates/cosmokit",
  "crates/schemastery",
  "crates/loader",
  "crates/llm",
  "crates/core",
  "crates/scope",
  "crates/tools",
  "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0-rc.5"
edition = "2024"
rust-version = "1.93.1"
license = "MIT"
repository = "https://github.com/deepseek-ai/seekdeep-harness"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
async-stream = "0.3.6"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["clock", "serde"] }
clap = { version = "4.5.54", features = ["derive", "env"] }
futures = "0.3.31"
indexmap = { version = "2.12.1", features = ["serde"] }
parking_lot = "0.12.5"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.148", features = ["preserve_order"] }
serde_yml = "0.0.12"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
uuid = { version = "1.19.0", features = ["serde", "v4", "v7"] }
walkdir = "2.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
