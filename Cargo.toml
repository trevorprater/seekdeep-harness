[workspace.package]
version = "0.1.0-rc.5"
edition = "2024"
rust-version = "1.93.1"
license = "MIT"
repository = "https://github.com/deepseek-ai/seekdeep-harness"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
async-stream = "0.3.6"
aws-config = "1.8.18"
aws-sdk-bedrockruntime = "1.135.0"
aws-smithy-types = "1.5.0"
aws-smithy-http-client = { version = "1.1.13", features = ["rustls-aws-lc"] }
aws-smithy-runtime = { version = "1.11.3", features = ["connector-hyper-0-14-x"] }
base64 = "0.22.1"
bytes = "1.11.0"
boa_engine = { version = "0.21.1", default-features = false }
chrono = { version = "0.4.42", features = ["clock", "serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.5.54", features = ["derive", "env"] }
cpu-time = "1.0.0"
crc32fast = "1.5.0"
dirs = "6.0.0"
encoding_rs = "0.8.35"
flate2 = "1.1.5"
google-cloud-auth = "1.15.0"
http = "1.5.0"
hyper-rustls = { version = "0.24.2", features = ["webpki-tokio"] }
futures = "0.3.31"
hex = "0.4.3"
libc = "0.2.180"
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.19", features = ["tokio"] }
html2md-rs = "0.12.2"
image = { version = "0.25.9", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
iana-time-zone = "0.1.64"
icu_collator = "=2.0.0"
icu_locale = "=2.0.0"
icu_timezone = "1.5.0"
indexmap = { version = "2.12.1", features = ["serde"] }
js-sys = "0.3.104"
num-traits = "0.2.19"
opentelemetry = { version = "0.32.0", default-features = false, features = ["logs"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["gzip-http", "http-json", "logs", "reqwest-client", "reqwest-rustls"] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["experimental_logs_batch_log_processor_with_async_runtime", "logs", "rt-tokio"] }
oxc_allocator = "=0.122.0"
oxc_ast = "=0.122.0"
oxc_ast_visit = "=0.122.0"
oxc_codegen = { version = "=0.122.0", default-features = false }
oxc_diagnostics = "=0.122.0"
oxc_parser = "=0.122.0"
oxc_semantic = "=0.122.0"
oxc_span = "=0.122.0"
oxc_transformer = "=0.122.0"
parking_lot = "0.12.5"
nix = { version = "0.30.1", default-features = false, features = ["process", "signal"] }
path-clean = "1.0.1"
portable-pty = "0.9.0"
percent-encoding = "2.3.2"
proptest = "1.9.0"
regex = "1.12.2"
regress = "0.11.1"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "stream"] }
rowan = "0.16.1"
ryu-js = "1.0.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
same-file = "1.0.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.148", features = ["preserve_order"] }
serde_yml = "0.0.12"
sha1 = "0.10"
sha2 = "0.10.9"
socket2 = "0.6.2"
sys-locale = "0.3.2"
thiserror = "2.0.17"
tempfile = "3.23.0"
terminal_size = "0.4.4"
tokio = { version = "1.49.0", features = ["full", "test-util"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
unicode-ident = "1.0.22"
unicode-normalization = "0.1.25"
uuid = { version = "1.19.0", features = ["serde", "v4", "v5", "v7"] }
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
serde-wasm-bindgen = "0.6.5"
web-sys = "0.3.104"
url = "2.5.7"
walkdir = "2.5.0"
yaml-edit = "0.2.3"
zstd = "0.13.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
