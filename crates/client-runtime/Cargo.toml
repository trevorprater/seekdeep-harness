[package]
name = "seekdeep-client-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "React-free Rust/WASM Client object layer and runtime services"
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["wasm-bindings"]
wasm-bindings = ["seekdeep-client-ui-slots/wasm-bindings"]

[dependencies]
base64.workspace = true
indexmap.workspace = true
futures.workspace = true
seekdeep-client-ui-slots = { path = "../client-ui-slots", default-features = false }
seekdeep-client-settings-contract = { path = "../client-settings-contract" }
seekdeep-cordis = { path = "../cordis" }
seekdeep-identity = { path = "../identity" }
seekdeep-lossless-json = { path = "../lossless-json" }
seekdeep-failure-display = { path = "../failure-display" }
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.77"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio.workspace = true

[lints]
workspace = true

[[test]]
name = "main"
path = "tests/main.rs"

[[test]]
name = "wasm_client_apply_parity"
path = "tests/wasm_client_apply_parity.rs"

[[test]]
name = "wasm_conversation_classifier_parity"
path = "tests/wasm_conversation_classifier_parity.rs"

[[test]]
name = "wasm_conversation_registry_parity"
path = "tests/wasm_conversation_registry_parity.rs"

[[test]]
