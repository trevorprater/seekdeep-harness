[package]
name = "seekdeep-client-locale"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-backed portable Rust/WASM locale registry and language preference UI"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
indexmap.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
seekdeep-cordis = { path = "../cordis" }
seekdeep-schemastery = { path = "../schemastery" }
seekdeep-settings = { path = "../settings" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["console"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.77"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
