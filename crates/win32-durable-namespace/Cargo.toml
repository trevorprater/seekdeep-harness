[package]
name = "seekdeep-win32-durable-namespace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Narrow MoveFileExW write-through namespace primitive"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# This crate is the documented narrow native exception to the workspace's
# unsafe ban. No other crate calls the raw platform API.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
