[package]
name = "seekdeep-client-ui-model-selection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust/WASM model directory and selection UI semantics"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures.workspace = true
seekdeep-client-ui-commands = { path = "../client-ui-commands" }
seekdeep-identity = { path = "../identity" }
serde.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
seekdeep-cordis = { path = "../cordis" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Node"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.77"

[dev-dependencies]
regex.workspace = true

[lints]
workspace = true
