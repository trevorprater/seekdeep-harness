[package]
name = "seekdeep-client-ui-primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable models and Rust/WASM React primitives for the SeekDeep browser UI"
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
markdown = "1.0.0"
serde.workspace = true
unicode-general-category = "1.1.0"
unicode-script = "=0.5.7"
unicode-width = "0.2.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Element", "Node"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.77"

[lints]
workspace = true

[[test]]
name = "main"
path = "tests/main.rs"

[[test]]
name = "wasm_atoms_parity"
path = "tests/wasm_atoms_parity.rs"

