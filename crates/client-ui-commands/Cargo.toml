[package]
name = "seekdeep-client-ui-commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust/WASM command UI contracts, ranking, and popup semantics"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["browser"]
browser = []

[dependencies]
futures.workspace = true
indexmap.workspace = true
seekdeep-commands-contract = { path = "../commands-contract" }
seekdeep-client-ui-input-trigger = { path = "../client-ui-input-trigger", default-features = false }
seekdeep-identity = { path = "../identity" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
seekdeep-cordis = { path = "../cordis" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Node"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.77"

[dev-dependencies]
regex.workspace = true

[lints]
workspace = true
