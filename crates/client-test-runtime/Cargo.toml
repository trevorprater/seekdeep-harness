[package]
name = "seekdeep-client-test-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
futures.workspace = true
parking_lot.workspace = true
ryu-js.workspace = true
seekdeep-client-settings-contract = { path = "../client-settings-contract" }
seekdeep-client-runtime = { path = "../client-runtime" }
seekdeep-cordis = { path = "../cordis" }
seekdeep-identity = { path = "../identity" }
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
seekdeep-host-directory-picker = { path = "../host-directory-picker" }
seekdeep-llm = { path = "../llm" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
seekdeep-client-web-react = { path = "../client-web-react" }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.77"

[lints]
workspace = true

[[test]]
name = "main"
path = "tests/main.rs"

[[test]]
name = "wasm_browser_languages_parity"
path = "tests/wasm_browser_languages_parity.rs"

[[test]]
name = "wasm_fixture_session_parity"
path = "tests/wasm_fixture_session_parity.rs"

[[test]]
name = "wasm_fixtures_parity"
path = "tests/wasm_fixtures_parity.rs"

[[test]]
name = "wasm_public_helpers_parity"
path = "tests/wasm_public_helpers_parity.rs"

[[test]]
name = "wasm_remote_parity"
path = "tests/wasm_remote_parity.rs"

[[test]]
name = "wasm_runtime_parity"
path = "tests/wasm_runtime_parity.rs"

[[test]]
name = "wasm_sessions_service_parity"
path = "tests/wasm_sessions_service_parity.rs"

[[test]]
name = "wasm_snapshot_parity"
path = "tests/wasm_snapshot_parity.rs"

[[test]]
name = "wasm_workspaces_parity"
path = "tests/wasm_workspaces_parity.rs"
