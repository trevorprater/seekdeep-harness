[package]
name = "seekdeep-client-ui-cordis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust/WASM Cordis inventory, lifecycle cards, and browser UI state"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
futures.workspace = true
parking_lot.workspace = true
seekdeep-cordis = { path = "../cordis" }
seekdeep-cordis-client-runner = { path = "../cordis-client-runner" }
seekdeep-cordis-dynamic-types = { path = "../cordis-dynamic-types" }
seekdeep-identity = { path = "../identity" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["console"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.77"

[lints]
workspace = true
