[package]
name = "seekdeep-session-log-export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Host command and browser controller for Session-log ZIP downloads"

[dependencies]
anyhow.workspace = true
futures.workspace = true
seekdeep-identity = { path = "../identity" }
serde.workspace = true
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
seekdeep-commands = { path = "../commands" }
seekdeep-cordis = { path = "../cordis" }
seekdeep-invariants = { path = "../invariants" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
  "AbortController",
  "AbortSignal",
  "Document",
  "HtmlAnchorElement",
  "Location",
  "Request",
  "RequestInit",
  "Response",
  "Window",
] }

[dev-dependencies]
seekdeep-agent = { path = "../agent" }
seekdeep-core = { path = "../core" }
seekdeep-llm = { path = "../llm" }
seekdeep-scope = { path = "../scope" }
seekdeep-system-prompt = { path = "../system-prompt" }
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
