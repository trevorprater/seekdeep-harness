[package]
name = "seekdeep-client-schema-form"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust/WASM schema rehydration and immutable settings drafts"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
seekdeep-cordis = { path = "../cordis" }
seekdeep-invariants = { path = "../invariants" }
seekdeep-schemastery = { path = "../schemastery" }
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.77"

[lints]
workspace = true
