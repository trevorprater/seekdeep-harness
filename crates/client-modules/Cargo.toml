[package]
name = "seekdeep-client-modules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust/WASM lazy Client module table and Host boot graph"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bytes.workspace = true
hex.workspace = true
http-body-util.workspace = true
hyper.workspace = true
indexmap.workspace = true
percent-encoding.workspace = true
seekdeep-cordis = { path = "../cordis" }
seekdeep-host-webserver = { path = "../host-webserver" }
seekdeep-invariants = { path = "../invariants" }
seekdeep-loader = { path = "../loader" }
sha1.workspace = true
tracing.workspace = true
url.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
  "Document",
  "Element",
  "HtmlElement",
  "HtmlHeadElement",
  "HtmlScriptElement",
  "Node",
  "NodeList",
  "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio.workspace = true
tempfile.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.77"

[lints]
workspace = true
