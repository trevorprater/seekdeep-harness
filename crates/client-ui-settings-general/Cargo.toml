[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
seekdeep-cordis = { path = "../cordis" }
