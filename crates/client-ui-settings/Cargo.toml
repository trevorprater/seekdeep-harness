[package]
name = "seekdeep-client-ui-settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable Rust/WASM settings namespace scope service and settings Slot contracts"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures.workspace = true
seekdeep-client-settings-contract = { path = "../client-settings-contract" }
seekdeep-client-ui-slots = { path = "../client-ui-slots", default-features = false }
seekdeep-schemastery = { path = "../schemastery" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
seekdeep-cordis = { path = "../cordis" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.77"


[lints]
workspace = true
