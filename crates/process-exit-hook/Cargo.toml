[package]
name = "seekdeep-process-exit-hook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Narrow native atexit bridge for SeekDeep managed-process finalization"
readme = "README.md"

[dependencies]
anyhow.workspace = true
libc.workspace = true
parking_lot.workspace = true
