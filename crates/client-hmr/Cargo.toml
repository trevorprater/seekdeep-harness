[package]
name = "seekdeep-client-hmr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust/WASM Client plugin hot reload chain"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bytes.workspace = true
http-body-util.workspace = true
hyper.workspace = true
seekdeep-client-modules = { path = "../client-modules" }
seekdeep-cordis = { path = "../cordis" }
seekdeep-host-webserver = { path = "../host-webserver" }
seekdeep-invariants = { path = "../invariants" }
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
  "console",
  "Document",
  "Element",
  "EventSource",
  "HtmlHeadElement",
  "MessageEvent",
  "Node",
  "NodeList",
  "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile.workspace = true
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.77"

[lints]
workspace = true
