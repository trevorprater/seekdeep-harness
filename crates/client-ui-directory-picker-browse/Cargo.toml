[package]
name = "seekdeep-client-ui-directory-picker-browse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable and Rust/WASM in-app directory browser"
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
seekdeep-cordis = { path = "../cordis" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.77"

[lints]
workspace = true

[[test]]
name = "main"
path = "tests/main.rs"

[[test]]
name = "wasm_apply_parity"
path = "tests/wasm_apply_parity.rs"

[[test]]
name = "wasm_controller_parity"
path = "tests/wasm_controller_parity.rs"

[[test]]
name = "wasm_ui_parity"
path = "tests/wasm_ui_parity.rs"
