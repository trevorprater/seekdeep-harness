[package]
name = "seekdeep-client-ui-subagent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust/WASM subagent catalog and read-only composer semantics"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
seekdeep-identity = { path = "../identity" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
seekdeep-cordis = { path = "../cordis" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
seekdeep-client-runtime = { path = "../client-runtime" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["Node"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-futures.workspace = true
wasm-bindgen-test = "0.3.77"

[dev-dependencies]
regex.workspace = true

[lints]
workspace = true
