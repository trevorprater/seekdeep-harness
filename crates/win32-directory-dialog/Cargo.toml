[package]
name = "seekdeep-win32-directory-dialog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Narrow Win32 IFileOpenDialog and WM_CLOSE ABI adapter"

[dependencies]
anyhow.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# This crate is the documented narrow native exception to the workspace's
# unsafe ban. Raw COM vtable dispatch and optional Win32 symbol lookup cannot
# be expressed through windows-sys without unsafe code; no caller receives a
# pointer, reference, or ownership token.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
