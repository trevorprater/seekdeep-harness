name: Prepare pinned source oracle
description: Check out the SOURCE_SNAPSHOT revision and prepare its executable specifications.

outputs:
  root:
    description: Native absolute path to the original source checkout.
    value: ${{ steps.location.outputs.root }}
  commit:
    description: Full source revision from SOURCE_SNAPSHOT.
    value: ${{ steps.pin.outputs.commit }}

runs:
  using: composite
  steps:
    - name: Read source oracle pin
      id: pin
      shell: bash
      run: |
        node --input-type=module <<'NODE'
        import { appendFileSync, readFileSync } from 'node:fs';
        const snapshot = readFileSync('SOURCE_SNAPSHOT', 'utf8');
        const commits = snapshot.split(/\r?\n/).filter(line => line.startsWith('commit='));
        if (commits.length !== 1 || !/^commit=[0-9a-f]{40}$/.test(commits[0])) {
          throw new Error('SOURCE_SNAPSHOT must contain one full source commit');
        }
        appendFileSync(process.env.GITHUB_OUTPUT, commits[0] + '\n');
        NODE

    - name: Allocate source checkout outside the project
      id: location
      shell: bash
      run: |
        node --input-type=module <<'NODE'
        import { appendFileSync, mkdtempSync, realpathSync } from 'node:fs';
        import { join } from 'node:path';
        const root = realpathSync(mkdtempSync(join(process.env.RUNNER_TEMP, 'seekdeep-source-oracle-')));
        appendFileSync(process.env.GITHUB_ENV, `SEEKDEEP_PARITY_SOURCE=${root}\n`);
        appendFileSync(process.env.GITHUB_OUTPUT, `root=${root}\n`);
        NODE

    - name: Check out the exact source revision
      id: checkout
      shell: bash
      env:
        SOURCE_COMMIT: ${{ steps.pin.outputs.commit }}
      run: |
        git -C "$SEEKDEEP_PARITY_SOURCE" init --quiet
        git -C "$SEEKDEEP_PARITY_SOURCE" remote add origin https://github.com/deepseek-ai/deepseek-harness.git
        git -C "$SEEKDEEP_PARITY_SOURCE" fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
        git -C "$SEEKDEEP_PARITY_SOURCE" checkout --quiet --detach FETCH_HEAD

    - name: Install original source dependencies
      shell: bash
      env:
        CI: 'true'
        DSH_TELEMETRY_DISABLED: '1'
      run: pnpm --dir "$SEEKDEEP_PARITY_SOURCE" install --frozen-lockfile

    - name: Build original Host artifacts
      shell: bash
      env:
        DSH_TELEMETRY_DISABLED: '1'
      run: pnpm --dir "$SEEKDEEP_PARITY_SOURCE" run build:lib:host
