name: E2E (pi-ai Azure OpenAI and Anthropic)

# This suite spends tokens against two external providers and is intentionally
# opt-in. It has no push, pull_request, schedule, or workflow_call trigger.
on:
  workflow_dispatch:
    inputs:
      azure_openai_model:
        description: Azure OpenAI model from pi-ai's installed catalog
        required: true
        default: gpt-5.5
        type: string
      anthropic_model:
        description: Anthropic model from pi-ai's installed catalog
        required: true
        default: claude-opus-4-8
        type: string

permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  SEEKDEEP_TELEMETRY_DISABLED: '1'

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: Azure OpenAI Responses + Anthropic Messages
    # The native suite compiles the pi-ai crate and its dependencies from a cold
    # cache before it spends a token.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.93.1

      - uses: Swatinem/rust-cache@v2
        with:
          key: pi-ai-provider-e2e

      - uses: ./.github/actions/prune-stale-v8-builds

      # The tests self-skip locally when a credential is absent. A manually
      # dispatched CI run must fail instead of reporting an all-skipped green.
      - name: Preflight (require provider API keys)
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY_EXTERNAL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_EXTERNAL }}
        run: |
          set -euo pipefail
          missing=0
          for name in AZURE_OPENAI_API_KEY ANTHROPIC_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is empty. Configure the corresponding *_EXTERNAL repository secret."
              missing=1
            fi
          done
          exit "$missing"

      # The credentialed lane runs the native mirror of the source's provider e2e
      # file with its ignored, key-gated cases included; the preflight above is
      # what keeps a missing secret from passing as an all-skipped green.
      - name: E2E tests (real Azure OpenAI and Anthropic APIs)
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY_EXTERNAL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_EXTERNAL }}
          SEEKDEEP_PI_AI_OPENAI_MODEL: ${{ inputs.azure_openai_model }}
          SEEKDEEP_PI_AI_OPENAI_BASE_URL: https://openai-routerhub-resource.services.ai.azure.com/api/projects/openai/openai/v1
          SEEKDEEP_PI_AI_ANTHROPIC_MODEL: ${{ inputs.anthropic_model }}
          SEEKDEEP_E2E_MAX_WORKERS: 2
        run: bash scripts/run-e2e-lane.sh crates/llm-pi-ai/tests/provider_apis_e2e.rs
