# Sandbox CI: the keyless real-kernel confinement proofs. This master-only
# reference stays outside the pull-request verdict; rationale lives in
# .agents/notes/implemented/process/2026-07-21-serial-cross-platform-ci-reference.md.
# A separate workflow from ci.yml because the axis is different — these jobs
# fan out over OS×runner (kernel capabilities), not node versions. The Landlock
# launcher is built from native/landlock-run on each Landlock leg and installed
# from the same tarballs the main-repository release workflow publishes.
name: Sandbox

on:
  push:
    branches: [master]
  # Manual runs let a branch prove the legs before its master merge; the
  # automatic trigger stays master-only.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  SEEKDEEP_TELEMETRY_DISABLED: '1'

jobs:
  # Keyless real-kernel sandbox proofs (sandbox Agent Note § Testing): each ladder
  # rung is only provable on a host where it enforces, so this job fans out
  # an OS×runner matrix — bwrap and Landlock on Linux (separate legs: the
  # Landlock files force the bwrap rung off, so each leg proves exactly one
  # rung; Landlock twice, once per architecture, each confining through the
  # locally built launcher), Seatbelt on macOS (sandbox-exec ships with
  # the OS). One node
  # version only: kernel confinement does not vary by node, and ci.yml's
  # node matrix already covers the node axis.
  #
  # The e2e suites self-skip where their runner is absent, so a leg that lost
  # its runner (no bwrap, kernel without Landlock, macOS without
  # sandbox-exec) would otherwise pass as a false green — the same trap
  # e2e.yml's key preflight guards against. Each leg therefore runs its
  # native world suites with SEEKDEEP_REQUIRE_SANDBOX_E2E set, under which a
  # self-skip is a failure: the port's form of the source's `Test Files
  # 2 passed (2)` run-guard.
  sandbox-e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: bwrap
          - os: ubuntu-24.04
            runner: landlock
          - os: ubuntu-24.04-arm
            runner: landlock
          - os: macos-latest
            runner: seatbelt
    name: sandbox e2e (${{ matrix.runner }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Every leg compiles its native suites from a cold cache; the Seatbelt leg
    # also compiles the sandbox crates' unit inventory.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: wasm32-unknown-unknown

      # The Landlock launcher's compiled Rust/WASM entry needs the binding
      # generator at the workspace crate version.
      - name: Install Rust/WASM binding generator
        if: matrix.runner == 'landlock'
        run: cargo install --locked wasm-bindgen-cli --version 0.2.127

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # The bwrap rung needs bubblewrap on PATH and unprivileged user
      # namespaces. Ubuntu 24.04 gates the latter behind an AppArmor knob;
      # lift it best-effort — on images where the knob is absent the
      # functional probe (and the run-guard below) is the arbiter anyway.
      - name: Install bubblewrap (unrestrict userns)
        if: matrix.runner == 'bwrap'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
            || echo "apparmor userns knob absent — the functional probe decides"

      - name: Build Landlock launcher for this architecture
        if: matrix.runner == 'landlock'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq musl-tools
          pnpm --dir native/landlock-run run build:ts
          pnpm --dir native/landlock-run run build:native

      # Each leg runs the native world suites that port its two platform files;
      # SEEKDEEP_REQUIRE_SANDBOX_E2E (and the launcher-specific require flags)
      # turn a self-skip into a failure, so a leg whose runner is missing cannot
      # pass as a false green.
      - name: Sandbox e2e (real kernel confinement, world-verified)
        env:
          SEEKDEEP_REQUIRE_SANDBOX_E2E: '1'
          SEEKDEEP_REQUIRE_BWRAP: ${{ matrix.runner == 'bwrap' && '1' || '' }}
          SEEKDEEP_REQUIRE_LANDLOCK: ${{ matrix.runner == 'landlock' && '1' || '' }}
        run: |
          set -euo pipefail
          case '${{ matrix.runner }}' in
            bwrap)
              cargo test --locked --all-features \
                --package seekdeep-sandbox-local --package seekdeep-bash-sandbox \
                --test bwrap_e2e
              ;;
            landlock)
              cargo test --locked --all-features \
                --package seekdeep-landlock-run --all-targets
              cargo test --locked --all-features \
                --package seekdeep-sandbox-local --test local_parity
              ;;
            seatbelt)
              cargo test --locked --all-features \
                --package seekdeep-sandbox-local --package seekdeep-bash-sandbox \
                --test seatbelt_e2e
              ;;
          esac

      # The unit inventory runs on ubuntu in ci.yml; this is the one darwin leg
      # in the workflow, so run the sandbox crates' unit and parity suites here
      # too — the platform-dependent expectations (Seatbelt path
      # canonicalization: /tmp IS /private/tmp) take their darwin branch only on
      # this runner.
      - name: Unit tests (darwin parity)
        if: matrix.runner == 'seatbelt'
        run: >-
          cargo test --locked --all-features
          --package seekdeep-sandbox-local --package seekdeep-bash-sandbox

      # Publish-path rehearsal, Landlock legs only. The launcher was built on its
      # native architecture above; pack the local entry and platform tarballs and
      # install them together so registry state cannot mask source/package
      # drift, then confine through the installed launcher.
      - name: Packed-distribution e2e (pack → install → confine)
        if: matrix.runner == 'landlock'
        run: |
          set -euo pipefail
          pnpm --dir native/landlock-run release:pack .release/npm --current-platform-only
          pnpm --dir native/landlock-run release:verify-packed-install .release/npm --current-platform-only
