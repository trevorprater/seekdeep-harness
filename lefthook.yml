# Git hooks (lefthook). Keep these local checkpoints fast; CI owns the full
# repository-wide gate matrix.
# Install: `pnpm run install-lefthook` (runs automatically via postinstall).

pre-commit:
  jobs:
    - name: translation pairing (staged records)
      glob: '*.i18n.yaml'
      exclude:
        - '.agents/notes/archived/**'
      run: cargo run --quiet --package seekdeep-repository-tools --bin verify-translation-pairing -- --cached {staged_files}

    - name: archived agent notes
      glob: '.agents/notes/archived/**'
      run: cargo run --quiet --package seekdeep-repository-tools --bin verify-archived-agent-notes --

    - name: lint (staged)
      glob: '*.{ts,tsx,mts,cts,mjs}'
      exclude:
        - 'vendor/*/src/**'
      run: cargo run --quiet --package seekdeep-repository-tools --bin run-oxlint -- --config .oxlintrc.staged.json --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    # Regenerate rather than reject: a dependency edit that forgot the notices
    # would otherwise fail the test lane long after the commit. The glob matches
    # every input the generator reads, including the generator itself.
    # Deleting a manifest cannot trigger this job —
    # lefthook only inspects files present on disk — so that one case still
    # falls through to the freshness assertion in the test lane.
    - name: third-party notices (staged)
      glob: '{package.json,*/package.json,*/*/package.json,*/*/*/package.json,*/*/*/*/package.json,pnpm-workspace.yaml,*/*/pnpm-workspace.yaml,pnpm-lock.yaml,vendor/README.md,python/*/pyproject.toml,crates/repository-tools/src/bin/gen-third-party-notices.rs,crates/repository-tools/src/third_party_notices.rs}'
      run: cargo run --quiet --package seekdeep-repository-tools --bin gen-third-party-notices -- && git add THIRD_PARTY_NOTICES.md

    - name: whitespace (staged)
      run: git diff --cached --check

    - name: vendor manifest guard
      run: scripts/check-vendor-manifest.sh

pre-merge-commit:
  jobs:
    - name: translation pairing (staged records)
      glob: '*.i18n.yaml'
      exclude:
        - '.agents/notes/archived/**'
      run: cargo run --quiet --package seekdeep-repository-tools --bin verify-translation-pairing -- --cached {staged_files}

    - name: archived agent notes
      glob: '.agents/notes/archived/**'
      run: cargo run --quiet --package seekdeep-repository-tools --bin verify-archived-agent-notes --

pre-push:
  jobs:
    - name: typecheck
      run: pnpm run typecheck
