# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@seekdeep-ai/seekdeep-system-prompt'

- id: tools
  name: '@seekdeep-ai/seekdeep-tools'

- id: subprocess
  name: '@seekdeep-ai/seekdeep-subprocess-local'

- id: bash
  name: '@seekdeep-ai/seekdeep-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@seekdeep-ai/seekdeep-shell-env'

- id: tasks
  name: '@seekdeep-ai/seekdeep-jobs-local'

- id: tool-jobs
  name: '@seekdeep-ai/seekdeep-tool-jobs'

- id: tool-pwsh
  name: '@seekdeep-ai/seekdeep-tool-pwsh'
