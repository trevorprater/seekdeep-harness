# Exercise the model-facing LSP tool through the shipped ACP app and Loader entry path.
# The scenario workspace supplies the deterministic stdio server used by this test composition.
- id: base
  name: '@seekdeep-ai/cordis-plugin-include'
  config:
    path: ../cordis.yml
    patches:
      - insert:
          - id: lsp
            name: '@seekdeep-ai/seekdeep-lsp'
          - id: lsp-stdio
            name: '@seekdeep-ai/seekdeep-lsp-stdio'
            config:
              servers:
                fixture:
                  # The snapshot runner exposes this compiled Rust fixture on PATH.
                  command: seekdeep-acp-lsp-fixture
                  extensionToLanguage:
                    '.ts': typescript
          - id: timeout-policy
            name: '@seekdeep-ai/seekdeep-tool-call-timeout-policy'
          - id: tool-lsp
            name: '@seekdeep-ai/seekdeep-tool-lsp'
            config:
              maxLocations: 1
