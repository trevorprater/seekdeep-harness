workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^python-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/'
    - when: never

stages:
  - build
  - publish

variables:
  GIT_DEPTH: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  MANYLINUX_X64_IMAGE: "quay.io/pypa/manylinux_2_28_x86_64@sha256:0536c364004fa2a3c5041120b6fe35d84fc5bfe31f04c6a6304f13eac4a67b63"
  MANYLINUX_ARM64_IMAGE: "quay.io/pypa/manylinux_2_28_aarch64@sha256:1676a4f178dc6cf8a1d1e3b7e1d71fca891a466ebde72a33880ccda8af3383d8"

.python-tools:
  before_script:
    - python3 -m venv .ci-python
    - . .ci-python/bin/activate
    - rustup toolchain install 1.93.1 --profile minimal --component clippy --component rustfmt
    - |
      release_versions="$(cargo run --quiet --locked -p seekdeep-python-release -- version --github-output)"
      export SEEKDEEP_VERSION="$(printf '%s\n' "$release_versions" | sed -n 's/^repository-version=//p')"
      export SEEKDEEP_WHEEL_VERSION="$(printf '%s\n' "$release_versions" | sed -n 's/^version=//p')"
    - test "$CI_COMMIT_TAG" = "python-v$SEEKDEEP_VERSION" || { echo "Tag $CI_COMMIT_TAG does not match package.json version $SEEKDEEP_VERSION"; exit 1; }
    - python -m pip install uv==0.11.23

sdk-wheel:
  extends: .python-tools
  stage: build
  tags: [linux-x64]
  script:
    - cargo run --quiet --locked -p seekdeep-python-release -- build --package sdk --tag "$CI_COMMIT_TAG" --output-dir release/sdk
  artifacts:
    paths: [release/sdk/*.whl]
    expire_in: 1 week

.runtime-wheel:
  extends: .python-tools
  stage: build
  script:
    - |
      if [ "${PLATFORM#linux-}" != "$PLATFORM" ]; then
        case "$PLATFORM" in
          linux-x64) image="$MANYLINUX_X64_IMAGE" ;;
          linux-arm64) image="$MANYLINUX_ARM64_IMAGE" ;;
          *) echo "Unsupported Linux platform $PLATFORM"; exit 1 ;;
        esac
        sdk_cargo_home="${CARGO_HOME:-$HOME/.cargo}"
        sdk_rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
        sdk_rust_bin="$(dirname "$(rustup which --toolchain 1.93.1 cargo)")"
        docker run --rm --user "$(id -u):$(id -g)" \
          -v "$PWD:$PWD" -v "$sdk_cargo_home:$sdk_cargo_home" -v "$sdk_rustup_home:$sdk_rustup_home" \
          -e CARGO_HOME="$sdk_cargo_home" -e RUSTUP_HOME="$sdk_rustup_home" \
          -e SEEKDEEP_RUST_BIN="$sdk_rust_bin" \
          -e CARGO_TARGET_DIR="$PWD/target/manylinux" -e CARGO_INCREMENTAL -e CARGO_BUILD_JOBS \
          -e PKG_TARGET -e CI=true -w "$PWD" "$image" bash -euxo pipefail -c '
            export PATH="$SEEKDEEP_RUST_BIN:$PATH"
            cargo run --locked -p seekdeep-python-release --bin build-exe-for-python-sdk -- --targets="$PKG_TARGET"
          '
      else
        cargo run --locked -p seekdeep-python-release --bin build-exe-for-python-sdk -- --targets="$PKG_TARGET"
      fi
    - EXE="$PWD/dist-exe/seekdeep-jsonrpc-agent-pkg-$PLATFORM"
    - test -x "$EXE"
    - uv run --python 3.10 --group test --project python/sdk python scripts/smoke-python-runtime.py --scenario all --exe "$EXE"
    - cargo run --quiet --locked -p seekdeep-python-release -- build --package runtime --tag "$CI_COMMIT_TAG" --platform "$PLATFORM" --runtime-exe "$EXE" --output-dir "release/$PLATFORM"
    - python -m venv .wheel-smoke
    - .wheel-smoke/bin/python -m pip install --find-links "release/$PLATFORM" --find-links release/sdk seekdeep-harness-sdk=="$SEEKDEEP_WHEEL_VERSION"
    - .wheel-smoke/bin/python scripts/smoke-python-runtime.py --scenario sdk-default
    - |
      if [ "${PLATFORM#linux-}" != "$PLATFORM" ]; then
        readelf --version-info "$EXE" > glibc-versions.txt
        maximum="$(sed -n 's/.*Name: GLIBC_\([0-9.]*\).*/\1/p' glibc-versions.txt | sort -V | tail -1)"
        test -n "$maximum"
        dpkg --compare-versions "$maximum" le 2.28
        case "$PLATFORM" in
          linux-x64) image="$MANYLINUX_X64_IMAGE" ;;
          linux-arm64) image="$MANYLINUX_ARM64_IMAGE" ;;
          *) echo "Unsupported Linux platform $PLATFORM"; exit 1 ;;
        esac
        docker run --rm -v "$PWD:/work" -w /work "$image" bash -euxo pipefail -c "/opt/python/cp310-cp310/bin/python -m venv /tmp/seekdeep-sdk && /tmp/seekdeep-sdk/bin/python -m pip install --find-links /work/release/$PLATFORM --find-links /work/release/sdk seekdeep-harness-sdk==$SEEKDEEP_WHEEL_VERSION && /tmp/seekdeep-sdk/bin/python /work/scripts/smoke-python-runtime.py --scenario sdk-default"
      fi
    - |
      if [ "$PLATFORM" = macos-arm64 ]; then
        cargo xtask macos-deployment-target "$EXE" "$EXE-spawn-helper"
      fi
  artifacts:
    paths: [release/$PLATFORM/*.whl]
    expire_in: 1 week

runtime-linux-x64:
  extends: .runtime-wheel
  tags: [linux-x64]
  variables:
    PKG_TARGET: node24-linux-x64
    PLATFORM: linux-x64
  needs:
    - job: sdk-wheel
      artifacts: true

runtime-linux-arm64:
  extends: .runtime-wheel
  tags: [linux-arm64]
  variables:
    PKG_TARGET: node24-linux-arm64
    PLATFORM: linux-arm64
  needs:
    - job: sdk-wheel
      artifacts: true

runtime-macos-arm64:
  extends: .runtime-wheel
  tags: [macos-arm64]
  variables:
    PKG_TARGET: node24-macos-arm64
    PLATFORM: macos-arm64
  needs:
    - job: sdk-wheel
      artifacts: true

publish-python:
  stage: publish
  tags: [linux-x64]
  resource_group: python-release
  needs:
    - job: sdk-wheel
      artifacts: true
    - job: runtime-linux-x64
      artifacts: true
    - job: runtime-linux-arm64
      artifacts: true
    - job: runtime-macos-arm64
      artifacts: true
  before_script:
    - python3 -m venv .ci-python
    - . .ci-python/bin/activate
    - rustup toolchain install 1.93.1 --profile minimal --component clippy --component rustfmt
    - |
      release_versions="$(cargo run --quiet --locked -p seekdeep-python-release -- version --github-output)"
      export SEEKDEEP_VERSION="$(printf '%s\n' "$release_versions" | sed -n 's/^repository-version=//p')"
      export SEEKDEEP_WHEEL_VERSION="$(printf '%s\n' "$release_versions" | sed -n 's/^version=//p')"
    - test "$CI_COMMIT_TAG" = "python-v$SEEKDEEP_VERSION" || { echo "Tag $CI_COMMIT_TAG does not match package.json version $SEEKDEEP_VERSION"; exit 1; }
    - python -m pip install twine==6.2.0
  script:
    - test "$(find release -name '*.whl' | wc -l | tr -d ' ')" = 4
    - test -f "release/sdk/seekdeep_harness_sdk-${SEEKDEEP_WHEEL_VERSION}-py3-none-any.whl"
    - test -f "release/linux-x64/seekdeep_harness_runtime_bin-${SEEKDEEP_WHEEL_VERSION}-py3-none-manylinux_2_28_x86_64.whl"
    - test -f "release/linux-arm64/seekdeep_harness_runtime_bin-${SEEKDEEP_WHEEL_VERSION}-py3-none-manylinux_2_28_aarch64.whl"
    - test -f "release/macos-arm64/seekdeep_harness_runtime_bin-${SEEKDEEP_WHEEL_VERSION}-py3-none-macosx_14_0_arm64.whl"
    - python -m twine check release/*/*.whl
    - export TWINE_USERNAME=gitlab-ci-token
    - export TWINE_PASSWORD="$CI_JOB_TOKEN"
    - export TWINE_REPOSITORY_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/pypi"
    - python -m twine upload --non-interactive release/*/*.whl || { echo 'Publish failed. GitLab does not overwrite an existing version; create a new python-v<repository-version> tag.'; exit 1; }
